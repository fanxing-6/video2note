interface:
  display_name: "Video2Note"
  short_description: "Turn Bilibili, YouTube, TikTok, or Douyin videos into expert-lecture Chinese LaTeX/PDF reports."
  default_prompt: >-
    Use this skill to turn a video source into a Chinese expert-lecture deep report and final LaTeX/PDF. First identify the video platform, then follow the matching SOP for acquisition and normalization. Keep the strongest video workflow: platform-aware metadata collection, original cover on the front page when valuable, raw/clean subtitle dual tracks with check_clean_srt.py validation when clean.srt is generated, direct visual inspection of extracted frames rather than OCR-only judgment, strong frame-to-text alignment, timestamp-aware transcription via faster-whisper large-v3, and a video content package that decouples writing from platform collection details. Before writing LaTeX, choose a primary report blueprint from assets/report-blueprints.md and, if useful, a secondary blueprint; record that choice in $TASK_DIR/analysis/outline.md using assets/analysis-outline-template.md. Also choose the active depth ladders from assets/depth-ladders.md and record them before writing prose. For each topic unit, record question, core_claim, mechanism, evidence_with_timestamps, formula_or_metric, cost_or_constraint_model, architecture_or_decision_flow, and actionable_takeaways. For 35-60 minute interview, panel, podcast, or Q&A videos, split the material into 8-12 medium-grained topic units first; do not write the final report by directly compressing the transcript. If a layer is not supported by the source, mark it as N/A with a reason in the analysis artifact and do not fabricate content. Write the body as a direct theme report rather than a recap of the speaker, interview, or video. Avoid body phrases such as “讲者认为”, “访谈里”, “这场讨论”, “这期视频”, or “视频中提到” except in metadata, footnotes, or dialoguebox. Default to one main claim per paragraph, usually 2-4 sentences, with chapter flow of judgment first, then mechanism, then evidence. When the selected blueprint or depth ladders imply a natural-segmentation section, a decision framework, a metric model, a cost model, or a flow diagram, do not silently skip those outputs. Use dialoguebox only for short high-signal original dialogue with speaker labels and timestamps; it is evidence, not the backbone of the main text. When the material supports it, explicitly cover concept definition, mechanism, formulas or metrics, cost or constraint models, architecture or decision flows, and reader-facing action guidance. When the video explains design flows, system architecture, module collaboration, decision chains, fallback paths, staged evolution, or trade-off logic, prefer concise TikZ or PGFPlots redraws using the shared engineering-whiteboard styles, compile each diagram as an independent standalone PDF before inserting it into the final report with includegraphics, visually inspect each standalone PDF and the final composed PDF page, and fix overlaps, unreadable labels, arrow ambiguity, clipping, page overflow, or style drift in the diagram LaTeX source before delivery. Before final delivery, produce or explicitly skip a coverage_review.md using assets/coverage-review-template.md, checking style guardrails, structure guardrails, analysis depth, actionability, missing details, over-summarization, figure-text mismatch, and the reasonableness of any N/A analysis fields. Produce a complete Chinese LaTeX document and final PDF.
