interface:
  display_name: "Video2Note"
  short_description: "Turn videos into Chinese expert-lecture LaTeX/PDF reports."
  default_prompt: >-
    Use this skill to turn an already identified video source or local video content package into a Chinese expert-lecture deep report and final PDF. Read SKILL.md first, then execute the workflow by stages. At the start of each stage, reload the matching phase card under references/ and record the card, inputs, outputs, gate result, unresolved issues, and next stage in $TASK_DIR/analysis/stage-ledger.md. Do not rely on one initial read of the full skill. Keep platform acquisition details in the matching SOP, build metadata/source.json before analysis, create analysis/outline.md before writing, write the final body as a direct theme report rather than a video recap, compile any TikZ/PGFPlots diagrams as standalone PDFs before insertion, and produce output/coverage_review.md before delivery. The final report should cover concepts, mechanisms, evidence, formulas or metrics, cost or constraint models, architecture or decision flows, and actionable guidance whenever the source supports them.
