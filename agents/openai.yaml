interface:
  display_name: "Video2Note"
  short_description: "Turn Bilibili, YouTube, TikTok, or Douyin videos into structured Chinese LaTeX/PDF notes."
  default_prompt: "Use this skill to turn a video source into a high-quality Chinese LaTeX note and final PDF. First identify the video platform, then follow the matching SOP for acquisition and normalization. Keep the strongest video workflow: platform-aware metadata collection, original cover on the front page when available, direct visual inspection of extracted frames rather than OCR-only judgment, strong frame-to-text alignment, timestamp-aware transcription via faster-whisper large-v3, and a video content package that decouples writing from platform collection details. When the video explains design flows, system architecture, module collaboration, decision chains, fallback paths, or staged evolution, prefer a concise TikZ or PGFPlots redraw using the template's shared engineering-whiteboard styles. Produce a complete Chinese LaTeX document with clear pedagogical motivation, logical continuity, high-value figures only when they improve understanding, vector-quality generated charts when needed, and a final synthesis section."
